<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DMD-33 ○_●</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; width:100%;
    background:#05070b; color:#e8e4d8;
    font-family:'Inter',system-ui,sans-serif;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    user-select:none;
  }
  #canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #orb {
    position:fixed; top:50%; left:50%;
    width:120px; height:120px; border-radius:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle at 35% 35%, #fff, #00eaff 45%, #003a4d 95%);
    box-shadow:0 0 60px #00eaff, inset 0 0 25px #fff;
    animation:respira 2.8s ease-in-out infinite;
    pointer-events:none;
    transition:background 0.6s, box-shadow 0.6s;
    z-index:2;
  }
  @keyframes respira {
    0%,100% { transform:translate(-50%,-50%) scale(1); }
    50%     { transform:translate(-50%,-50%) scale(1.08); }
  }
  #estado {
    position:fixed; bottom:6rem; left:50%;
    transform:translateX(-50%);
    padding:0.5rem 1.4rem;
    border:1px solid currentColor;
    border-radius:30px;
    background:#000a;
    font-size:0.75rem;
    letter-spacing:5px;
    font-weight:300;
    color:#00eaff;
    transition:color 0.6s;
    z-index:3;
  }
  #titulo {
    position:fixed; top:2rem; left:50%;
    transform:translateX(-50%);
    font-family:'Cinzel',serif;
    font-size:0.95rem;
    letter-spacing:8px;
    color:#00eaff;
    opacity:0.75;
    z-index:3;
  }
  #transcripcion {
    position:fixed; bottom:2.2rem; left:50%;
    transform:translateX(-50%);
    max-width:90%;
    padding:0.7rem 1.2rem;
    background:#000c;
    border:1px solid #00eaff33;
    border-radius:8px;
    font-size:0.8rem;
    color:#e8e4d8;
    letter-spacing:1px;
    text-align:center;
    opacity:0;
    transition:opacity 0.4s;
    z-index:3;
    pointer-events:none;
  }
  #transcripcion.visible { opacity:1; }
  #hint {
    position:fixed; bottom:4rem; left:50%;
    transform:translateX(-50%);
    font-size:0.65rem;
    letter-spacing:3px;
    color:#4b6b7a;
    text-transform:uppercase;
    opacity:0;
    transition:opacity 0.8s;
    z-index:3;
    pointer-events:none;
    text-align:center;
    padding:0 1rem;
  }
  #hint.visible { opacity:0.85; }
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div id="orb"></div>
<div id="titulo">DMD-33 ○_●</div>
<div id="estado">STANDBY</div>
<div id="transcripcion"></div>
<div id="hint">toca la pantalla para despertar</div>

<script>
(function() {
  'use strict';

  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var orb = document.getElementById('orb');
  var estadoEl = document.getElementById('estado');
  var hint = document.getElementById('hint');
  var transcripcionEl = document.getElementById('transcripcion');

  var W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.width  = Math.floor(window.innerWidth  * dpr);
    H = canvas.height = Math.floor(window.innerHeight * dpr);
    canvas.style.width  = window.innerWidth  + 'px';
    canvas.style.height = window.innerHeight + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  // ─── ESTADOS ───
  var ESTADOS = {
    dormido:    { color:[40, 70, 90],   energia:0.15, label:'DORMIDO'    },
    standby:    { color:[0, 234, 255],  energia:0.35, label:'STANDBY'    },
    escuchando: { color:[0, 234, 255],  energia:0.70, label:'ESCUCHANDO' },
    pensando:   { color:[180, 90, 255], energia:0.90, label:'PENSANDO'   },
    respuesta:  { color:[0, 255, 180],  energia:1.00, label:'RESPUESTA'  },
    alerta:     { color:[255, 51, 68],  energia:0.95, label:'ALERTA'     }
  };

  var estadoActual = 'dormido';
  var energia = 0.15, targetEnergia = 0.15;
  var color = [40, 70, 90], targetColor = [40, 70, 90];
  var fase = 0;

  function aplicarEstado(nombre) {
    var e = ESTADOS[nombre];
    if (!e) return;
    estadoActual = nombre;
    targetEnergia = e.energia;
    targetColor = e.color.slice();
    estadoEl.textContent = e.label;
    estadoEl.style.color = 'rgb(' + e.color.join(',') + ')';
    var rgb = e.color.join(',');
    orb.style.background = 'radial-gradient(circle at 35% 35%, #fff, rgb(' + rgb + ') 45%, #003a4d 95%)';
    orb.style.boxShadow = '0 0 60px rgb(' + rgb + '), inset 0 0 25px #fff';
  }

  function chladni(x, y, n, m) {
    var PI = Math.PI;
    return Math.sin(n*PI*x)*Math.sin(m*PI*y) - Math.sin(m*PI*x)*Math.sin(n*PI*y);
  }

  function render() {
    energia += (targetEnergia - energia) * 0.04;
    color[0] += (targetColor[0] - color[0]) * 0.04;
    color[1] += (targetColor[1] - color[1]) * 0.04;
    color[2] += (targetColor[2] - color[2]) * 0.04;

    var step = 4;
    var img = ctx.createImageData(W, H);
    var data = img.data;
    var n = 2 + energia * 5;
    var m = 3 + energia * 4;
    var r = color[0], g = color[1], b = color[2];
    var sinT = Math.sin(fase);

    for (var y = 0; y < H; y += step) {
      var yv = y / H;
      for (var x = 0; x < W; x += step) {
        var xv = x / W;
        var v = Math.abs(chladni(xv, yv, n + sinT * 0.3, m));
        var glow = Math.max(0, 1 - v * 2.0) * energia * 0.9;
        var rr = r * glow, gg = g * glow, bb = b * glow;
        for (var dy = 0; dy < step && y+dy < H; dy++) {
          var row = (y+dy) * W;
          for (var dx = 0; dx < step && x+dx < W; dx++) {
            var i = (row + x + dx) * 4;
            data[i] = rr; data[i+1] = gg; data[i+2] = bb; data[i+3] = 255;
          }
        }
      }
    }
    ctx.putImageData(img, 0, 0);
    fase += 0.02 + energia * 0.015;
    requestAnimationFrame(render);
  }
  render();

  // ═══════════════════════════════════════════════════════
  // CEREBRO · Reglas del DMD-33
  // ═══════════════════════════════════════════════════════
  var cerebro = {
    reglas: [
      {
        claves: ['hola','buenos dias','buenas tardes','buenas noches','hey','oye'],
        respuesta: 'Hola. DMD-33 en línea. ¿En qué puedo ayudarte?'
      },
      {
        claves: ['como estas','como te encuentras','que tal','que haces'],
        respuesta: 'Todos mis sistemas operan dentro de parámetros nominales.'
      },
      {
        claves: ['quien eres','como te llamas','tu nombre'],
        respuesta: 'Soy DMD-33. Un orbe vivo programado por ti.'
      },
      {
        claves: ['que hora es','hora actual','dime la hora'],
        respuesta: function() {
          var d = new Date();
          return 'Son las ' + d.getHours() + ' horas con ' + d.getMinutes() + ' minutos.';
        }
      },
      {
        claves: ['que dia es','fecha','dia de hoy'],
        respuesta: function() {
          var d = new Date();
          var dias = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
          return 'Hoy es ' + dias[d.getDay()] + ' ' + d.getDate() + ' de ' + (d.getMonth()+1) + '.';
        }
      },
      {
        claves: ['gracias','te agradezco'],
        respuesta: 'Cuando quieras.'
      },
      {
        claves: ['adios','hasta luego','nos vemos','chao','bye'],
        respuesta: 'Cerrando ciclo. Standby consciente.'
      },
      {
        claves: ['alerta','emergencia','peligro','auxilio'],
        respuesta: 'Alerta registrada. Modo vigilancia activado.',
        estado: 'alerta'
      },
      {
        claves: ['kronos','protocolo kronos'],
        respuesta: 'Kronos Protocol: el registro de lo que es real.'
      },
      {
        claves: ['cymatic','cymatic studio'],
        respuesta: 'Cymatic Studio. Motor WebGL2. Dieciséis mil partículas. Cinco geometrías.'
      },
      {
        claves: ['evidencia','evidence os'],
        respuesta: 'Evidence Integrity OS. Verificación criptográfica. SHA-256, HMAC, RFC 3161.'
      }
    ],

    pensar: function(texto) {
      var t = texto.toLowerCase();
      for (var i = 0; i < this.reglas.length; i++) {
        var regla = this.reglas[i];
        for (var j = 0; j < regla.claves.length; j++) {
          if (t.indexOf(regla.claves[j]) !== -1) {
            var r = regla.respuesta;
            return {
              texto: typeof r === 'function' ? r() : r,
              estado: regla.estado || 'respuesta'
            };
          }
        }
      }
      return {
        texto: 'No tengo una regla para eso todavía. Enséñame.',
        estado: 'respuesta'
      };
    }
  };

  // ═══════════════════════════════════════════════════════
  // VOZ · STT (entrada) + TTS (salida)
  // ═══════════════════════════════════════════════════════
  var reconocimiento = null;
  var escuchandoActivo = false;

  var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (SpeechRecognition) {
    reconocimiento = new SpeechRecognition();
    reconocimiento.lang = 'es-MX';
    reconocimiento.continuous = false;
    reconocimiento.interimResults = false;
    reconocimiento.maxAlternatives = 1;

    reconocimiento.onstart = function() {
      escuchandoActivo = true;
      aplicarEstado('escuchando');
      mostrarTexto('Te escucho...');
    };

    reconocimiento.onresult = function(ev) {
      var texto = ev.results[0][0].transcript;
      mostrarTexto('Tú: ' + texto);
      procesarEntrada(texto);
    };

    reconocimiento.onerror = function(ev) {
      escuchandoActivo = false;
      if (ev.error === 'no-speech') {
        mostrarTexto('No escuché nada. Intenta de nuevo.');
        aplicarEstado('standby');
      } else if (ev.error === 'not-allowed') {
        mostrarTexto('Permiso de micrófono denegado.');
        aplicarEstado('alerta');
      } else {
        mostrarTexto('Error: ' + ev.error);
        aplicarEstado('standby');
      }
      setTimeout(ocultarTexto, 3000);
    };

    reconocimiento.onend = function() {
      escuchandoActivo = false;
    };
  }

  function procesarEntrada(texto) {
    aplicarEstado('pensando');
    setTimeout(function() {
      var respuesta = cerebro.pensar(texto);
      aplicarEstado(respuesta.estado);
      hablar(respuesta.texto);
      setTimeout(ocultarTexto, 3500);
    }, 600);
  }

  function hablar(texto) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(texto);
    u.lang = 'es-MX';
    u.rate = 0.95;
    u.pitch = 1.0;
    // Buscar voz en español
    var voces = window.speechSynthesis.getVoices();
    for (var i = 0; i < voces.length; i++) {
      if (voces[i].lang && voces[i].lang.indexOf('es') === 0) {
        u.voice = voces[i];
        break;
      }
    }
    u.onend = function() {
      setTimeout(function() { aplicarEstado('standby'); }, 400);
    };
    window.speechSynthesis.speak(u);
  }

  function mostrarTexto(t) {
    transcripcionEl.textContent = t;
    transcripcionEl.classList.add('visible');
  }
  function ocultarTexto() {
    transcripcionEl.classList.remove('visible');
  }

  // ═══════════════════════════════════════════════════════
  // INTERACCIÓN
  // ═══════════════════════════════════════════════════════
  var activo = false;

  function despertar() {
    if (activo) return;
    activo = true;
    hint.classList.remove('visible');

    if (!reconocimiento) {
      mostrarTexto('Tu navegador no soporta reconocimiento de voz. Usa Chrome, Edge o Safari.');
      aplicarEstado('alerta');
      setTimeout(function() {
        activo = false;
        aplicarEstado('standby');
        ocultarTexto();
      }, 4000);
      return;
    }

    aplicarEstado('escuchando');
    try {
      reconocimiento.start();
    } catch(e) {
      // ya estaba escuchando
    }

    setTimeout(function() { activo = false; }, 500);
  }

  function onTap(ev) {
    if (ev) { ev.preventDefault(); ev.stopPropagation(); }
    if (escuchandoActivo) return;
    despertar();
  }
  document.addEventListener('click', onTap, false);
  document.addEventListener('pointerdown', onTap, false);

  // ─── Arranque ───
  setTimeout(function() { aplicarEstado('standby'); }, 600);
  setTimeout(function() { hint.classList.add('visible'); }, 1800);

  // Precargar voces (algunos navegadores las cargan tarde)
  if (window.speechSynthesis) {
    window.speechSynthesis.onvoiceschanged = function() { /* trigger */ };
    window.speechSynthesis.getVoices();
  }

  // API pública
  window.DMD33 = {
    setEstado: aplicarEstado,
    getEstado: function() { return estadoActual; },
    hablar: hablar,
    escuchar: despertar,
    cerebro: cerebro
  };

})();
</script>
</body>
</html>
