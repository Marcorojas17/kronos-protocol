<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DMD-33 ○_● · Orbe vivo</title>
<style>
  :root {
    --cyan: #00eaff;
    --amber: #ffb300;
    --red: #ff3344;
    --bg: #05070d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: #e6f7ff;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; overflow: hidden;
  }
  header {
    padding: 1.2rem; letter-spacing: 6px; color: var(--cyan);
    font-weight: 300; font-size: 1.1rem;
  }
  #stage { position: relative; width: 100vw; flex: 1; }
  #cymatic {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
  }
  #orb {
    position: absolute; top: 50%; left: 50%;
    width: 120px; height: 120px; border-radius: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle at 35% 35%, #fff, var(--cyan) 40%, #003a4d 90%);
    box-shadow: 0 0 60px var(--cyan), inset 0 0 25px #fff;
    animation: pulse 2.6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes pulse {
    0%,100% { transform: translate(-50%,-50%) scale(1); }
    50%     { transform: translate(-50%,-50%) scale(1.08); }
  }
  #estado {
    position: absolute; bottom: 1.2rem; left: 50%;
    transform: translateX(-50%);
    color: var(--cyan); letter-spacing: 3px; font-size: 0.85rem;
    background: #000a; padding: 0.4rem 1rem; border-radius: 20px;
  }
  nav {
    padding: 1rem; display: flex; gap: 1rem;
  }
  nav a {
    color: var(--cyan); text-decoration: none;
    border: 1px solid var(--cyan); padding: 0.4rem 0.9rem;
    border-radius: 20px; font-size: 0.8rem; letter-spacing: 2px;
  }
  nav a:hover { background: var(--cyan); color: #000; }
</style>
</head>
<body>
  <header>DMD-33 ○_●</header>

  <div id="stage">
    <canvas id="cymatic"></canvas>
    <div id="orb"></div>
    <div id="estado">STANDBY</div>
  </div>

  <nav>
    <a href="../cymatic/live-pro.html">CYMATIC LIVE-PRO</a>
    <a href="../cymatic/studio.html">CYMATIC STUDIO</a>
    <a href="./flow.html">FLOW</a>
  </nav>

<script type="module">
  // ─────────────────────────────────────────────
  // DMD-33 · Orquestador de estado
  // Traduce estado → audio sintético → CYMATIC
  // ─────────────────────────────────────────────
  const canvas = document.getElementById('cymatic');
  const ctx = canvas.getContext('2d');
  const estadoEl = document.getElementById('estado');
  const orb = document.getElementById('orb');

  function resize() {
    canvas.width = canvas.clientWidth * devicePixelRatio;
    canvas.height = canvas.clientHeight * devicePixelRatio;
  }
  window.addEventListener('resize', resize); resize();

  // ── Motor cymatic embebido (versión mínima) ──
  let t = 0;
  const state = {
    modo: 'standby',
    freq: 40,        // Hz sintético
    energia: 0.2,    // 0..1
    color: [0, 234, 255],
  };

  const modos = {
    standby:   { freq: 40,  color: [0, 234, 255] },
    escuchando:{ freq: 440, color: [0, 234, 255] },
    pensando:  { freq: 220, color: [180, 90, 255] },
    alerta:    { freq: 880, color: [255, 51, 68]  },
    respuesta: { freq: 660, color: [0, 255, 180]  },
  };

  function chladni(x, y, n, m) {
    return Math.sin(n*Math.PI*x)*Math.sin(m*Math.PI*y)
         - Math.sin(m*Math.PI*x)*Math.sin(n*Math.PI*y);
  }

  function render() {
    const w = canvas.width, h = canvas.height;
    const img = ctx.createImageData(w, h);
    const e = state.energia;
    const n = 2 + e * 6;
    const m = 3 + e * 5;
    const [r, g, b] = state.color;

    // submuestreo para rendimiento en móvil
    const step = 2;
    for (let y = 0; y < h; y += step) {
      for (let x = 0; x < w; x += step) {
        const v = Math.abs(chladni(x/w, y/h, n, m));
        const glow = Math.max(0, 1 - v * 2.2) * e;
        for (let dy = 0; dy < step; dy++) {
          for (let dx = 0; dx < step; dx++) {
            const i = ((y+dy)*w + (x+dx)) * 4;
            img.data[i]   = r * glow;
            img.data[i+1] = g * glow;
            img.data[i+2] = b * glow;
            img.data[i+3] = 255;
          }
        }
      }
    }
    ctx.putImageData(img, 0, 0);
    t += 0.02;
    requestAnimationFrame(render);
  }

  function setEstado(nombre) {
    if (!modos[nombre]) return;
    state.modo = nombre;
    state.freq = modos[nombre].freq;
    state.color = modos[nombre].color;
    estadoEl.textContent = nombre.toUpperCase();
    orb.style.background = `radial-gradient(circle at 35% 35%, #fff,
      rgb(${state.color.join(',')}) 40%, #003a4d 90%)`;
    orb.style.boxShadow = `0 0 60px rgb(${state.color.join(',')}), inset 0 0 25px #fff`;
  }

  // ── Ciclo de estado (simulación v0.1) ──
  const ciclo = ['standby','escuchando','pensando','respuesta','standby','alerta','standby'];
  let idx = 0;
  setInterval(() => {
    idx = (idx + 1) % ciclo.length;
    setEstado(ciclo[idx]);
    state.energia = 0.2 + Math.random() * 0.6;
  }, 4000);

  render();

  // ── Cuando conectes micrófono real, reemplazas esto
  // por el analyser de tu live-pro.html ──
  window.DMD33 = { setEstado, state };
</script>
</body>
</html>
