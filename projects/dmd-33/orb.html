btn.addEventListener('click',async function(e){e.preventDefault();
if(!iniciado){var ok=await pedirMic();if(!ok)return;iniciado=true;paradaManual=false;setEst('standby');if(!SR){errShow('Sin reconocimiento','Usa Chrome, Edge o Safari.');btn.textContent='No disponible';btn.disabled=true;return}btn.textContent='Hablar';btn.disabled=false;setTimeout(hablar,300);return}
if(escuchando){paradaManual=true;parar()}else{paradaManual=false;hablar()}});

function abrir(t,h){pt.textContent=t;pc.innerHTML=h;panel.classList.add('v')}
function fx(ts){var d=new Date(ts);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}

document.getElementById('bh').addEventListener('click',function(){var c=M.conv.slice().reverse();if(!c.length){abrir('HISTORIAL','<div class="sec"><p style="color:#6a6a72;text-align:center;font-size:.75rem">Sin conversaciones.</p></div>');return}var h='<div class="sec"><h3>'+c.length+' mensajes</h3>';for(var i=0;i<Math.min(c.length,100);i++){var x=c[i];h+='<div class="fi"><div class="q">'+(x.q==='u'?'Tú':'DMD-33')+' · '+fx(x.ts)+'</div>'+esc(x.t).replace(/\n/g,'<br>')+'</div>'}h+='</div>';abrir('HISTORIAL',h)});

document.getElementById('bd').addEventListener('click',function(){
var hh=M.hechos.slice().reverse();
var h='<div class="sec"><h3>Perfil</h3><div class="fi"><div class="q">Nombre</div>'+(M.perfil.nombre||'sin nombre')+'</div><div class="fi"><div class="q">Interacciones</div>'+M.perfil.n+'</div><div class="fi"><div class="q">SHA obra</div>'+SHA.slice(0,32)+'…</div><div class="fi"><div class="q">TX Ethereum</div>'+TX.slice(0,42)+'…</div></div>';
h+='<div class="sec"><h3>Hechos ('+hh.length+')</h3>';
if(!hh.length)h+='<p style="color:#6a6a72;font-size:.75rem">Aún no me has enseñado nada. Di: recuerda que...</p>';
else for(var i=0;i<hh.length;i++)h+='<div class="fi"><div class="q">'+hh[i].k+'</div>'+esc(hh[i].v)+'</div>';
h+='</div><div class="sec"><div class="ac"><button onclick="window.DMD33.identidad()">Construir mi identidad</button><button onclick="window.DMD33.borrar()" class="d">Borrar todo</button></div></div>';
abrir('DATOS',h)});

document.getElementById('be').addEventListener('click',function(){
var b=new Blob([M.exportar()],{type:'application/json'});var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download='dmd33_'+hoy()+'.json';a.click();URL.revokeObjectURL(u);abrir('EXPORTAR','<div class="sec"><p style="color:#c9a44c;text-align:center;font-size:.85rem">Descargado.</p><p style="color:#6a6a72;text-align:center;font-size:.7rem;margin-top:1rem">'+M.conv.length+' mensajes · '+M.hechos.length+' hechos.</p></div>')});

window.DMD33={setEstado:setEst,hablar:decir,escuchar:hablar,parar:parar,memoria:M,sha:SHA,tx:TX,
identidad:function(){var nb=M.perfil.nombre||'el usuario';var l=['Eres '+nb+'.'];if(M.hechos.length)l.push('Sabes: '+M.hechos.slice(-3).map(function(h){return h.k}).join(', '));l.push('Construyes. Y lo que construyes, queda.');var txt=l.join('\n');panel.classList.remove('v');addMsg('a',txt);decir(txt)},
borrar:function(){if(!confirm('¿Borrar toda la memoria?'))return;M.reset();log.innerHTML='';addMsg('a','Empezamos de cero.');panel.classList.remove('v')},
exportar:function(){return M.exportar()}};

(function saludo(){var n=M.perfil.nombre,t=M.perfil.n;if(t<=1&&!n){setTimeout(function(){addMsg('a','Soy DMD-33. Orbe vivo.\nRegistro, verifico, construyo.\nSHA: '+SHA.slice(0,20)+'…')},800);return}
var l=[];if(n)l.push('Hola, '+n+'.');else l.push('Hola otra vez.');
if(M.hechos.length)l.push('Sabes '+M.hechos.length+' cosas de mí.');
l.push('Te veo.');
setTimeout(function(){addMsg('a',l.join('\n'))},800)})();

dbgSet('Listo. Toca el botón.');

})();
