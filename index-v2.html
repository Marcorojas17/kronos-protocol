<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navegador · KRONOS</title>
<style>
  :root {
    --bg: #0a0a0b;
    --panel: #14141c;
    --panel-hover: #1c1c26;
    --gold: #c9a227;
    --gold-light: #e5c76b;
    --gold-dim: #6b4e0f;
    --text: #e8e8e8;
    --muted: #888;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'SF Mono', Menlo, Consolas, monospace;
    min-height: 100vh;
    line-height: 1.5;
  }
  body { padding: 20px 16px 60px; }

  header {
    max-width: 900px;
    margin: 0 auto 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(201, 162, 39, 0.3);
  }
  h1 {
    color: var(--gold);
    font-size: 16px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .sub {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 1px;
  }

  .buscador {
    max-width: 900px;
    margin: 0 auto 24px;
  }
  .buscador input {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--gold-dim);
    border-radius: 6px;
    color: var(--text);
    padding: 12px 14px;
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 0.5px;
  }
  .buscador input:focus {
    outline: none;
    border-color: var(--gold);
  }
  .buscador input::placeholder { color: var(--muted); }

  .contenedor { max-width: 900px; margin: 0 auto; }

  .grupo { margin-bottom: 24px; }
  .grupo h2 {
    color: var(--gold-light);
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid rgba(201, 162, 39, 0.25);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .grupo h2 .badge {
    background: rgba(201, 162, 39, 0.15);
    color: var(--gold);
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    letter-spacing: 1px;
    font-weight: normal;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 8px;
  }

  .card {
    display: block;
    background: var(--panel);
    border: 1px solid rgba(201, 162, 39, 0.2);
    border-radius: 6px;
    padding: 12px 14px;
    color: var(--text);
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 0.5px;
    transition: all 0.15s ease;
    cursor: pointer;
    word-break: break-word;
  }
  .card:hover, .card:active {
    background: var(--panel-hover);
    border-color: var(--gold);
    transform: translateY(-2px);
  }
  .card .label {
    color: var(--gold-light);
    display: block;
    margin-bottom: 4px;
    font-weight: bold;
  }
  .card .url {
    color: var(--muted);
    font-size: 10px;
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .card.oculto { display: none; }

  .sin-resultados {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 40px 20px;
    display: none;
  }
  .sin-resultados.visible { display: block; }

  footer {
    text-align: center;
    color: var(--gold-dim);
    font-size: 10px;
    margin-top: 40px;
    letter-spacing: 1px;
    line-height: 1.8;
  }
</style>
</head>
<body>

<header>
  <h1>◢◤ Navegador KRONOS</h1>
  <div class="sub" id="total">cargando...</div>
</header>

<div class="buscador">
  <input type="text" id="buscador" placeholder="Buscar página..." autocomplete="off">
</div>

<div class="contenedor" id="contenedor"></div>

<div class="sin-resultados" id="sin-resultados">
  No se encontraron páginas con ese texto.
</div>

<footer>
  <div>○_● · ◢◤◥◣ · ◥◣◢◤</div>
  <div>51% HUMANO · 49% IA · 100% REAL</div>
  <div>"El legado no se hereda. Se firma."</div>
</footer>

<script>
// ═══════════════════════════════════════════════════════════════════
// LISTA COMPLETA DE PÁGINAS · 75 entradas organizadas
// ═══════════════════════════════════════════════════════════════════

  ]},

    { label: 'notario-digital', url: '08-HERRAMIENTAS/notario-digital.html' },
    { label: 'verificador v0.3', url: '02-VERIFICADOR/verificador.html' },
    { label: 'generar-fundador-v2', url: '08-HERRAMIENTAS/generar-fundador-v2.html' }
  ]},
  { titulo: 'CIUDAD', items: [
    { label: 'índice ciudad', url: 'docs/CIUDAD/index.html' },
    { label: 'lector', url: 'docs/CIUDAD/lector.html' },
    { label: 'firmar', url: 'docs/CIUDAD/firmar.html' },
    { label: 'verificar', url: 'docs/CIUDAD/verificar.html' },
    { label: 'certificado', url: 'docs/CIUDAD/certificado.html' }
  ]},
  { titulo: 'DOCS', items: [
    { label: 'docs/index', url: 'docs/index.html' },
    { label: 'demos-oficiales', url: 'docs/demos-oficiales.html' },
    { label: 'kronos-para-niños', url: 'docs/kronos-para-ninos.html' },
    { label: 'tesis-visual', url: 'docs/tesis-visual.html' }
  ]},
  { titulo: 'MOVIMIENTO', items: [
    { label: 'movimiento/index', url: 'movimiento/index.html' },
    { label: 'carta de bienvenida', url: 'movimiento/carta-bienvenida.html' },
    { label: 'fundador', url: 'movimiento/fundador.html' },

    { label: 'certificado fundacional', url: 'movimiento/registro-fundacional/certificado-fundacional.html' }
  ]},
  { titulo: 'CERTIFICACIÓN', items: [
    { label: 'certificado maestro', url: 'certificacion/certificado-maestro.html' },
    { label: 'anclaje manifest', url: 'certificacion/anclaje-manifest/index.html' },
    { label: 'emisor certificados', url: 'certificacion/emisor-certificados/index.html' },
    { label: 'manifest integridad', url: 'certificacion/manifest-integridad/index.html' },
    { label: 'notario kronos', url: 'certificacion/notario-kronos/index.html' },

  ]},

    { label: 'cripto core', url: 'cimiento/cripto-core/index.html' },

  ]},
  { titulo: 'CIERRE', items: [

  ]},
  { titulo: 'GOBERNANZA', items: [
    { label: 'ejecución decisiones', url: 'gobernanza/ejecucion-decisiones/index.html' },
    { label: 'propuestas votación', url: 'gobernanza/propuestas-votacion/index.html' },
    { label: 'quorum mayorías', url: 'gobernanza/quorum-mayorias/index.html' },
    { label: 'revocación auditoría', url: 'gobernanza/revocacion-auditoria/index.html' }
  ]},
  { titulo: 'IDENTIDAD', items: [
    { label: 'registro humano', url: 'identidad/registro-humano/index.html' },
    { label: 'pasaporte humano', url: 'identidad/registro-humano/pasaporte-visual.html' },
    { label: 'registro IA', url: 'identidad/registro-ia/index.html' },

  ]},
  { titulo: 'LEGADO', items: [
    { label: 'autoría', url: 'legado/autoria/index.html' },
    { label: 'filosofía', url: 'legado/filosofia/index.html' },
    { label: 'génesis', url: 'legado/genesis/index.html' },
    { label: 'manifiesto', url: 'legado/manifiesto/index.html' }
  ]},
  { titulo: 'MÓDULOS', items: [
    { label: 'bóveda voz', url: 'modulos/boveda-voz/index.html' },
    { label: 'evidence OS', url: 'modulos/evidence-os/index.html' }
  ]},
  { titulo: 'OPERACIÓN', items: [
    { label: 'dashboard salud', url: 'operacion/dashboard-salud/index.html' },
    { label: 'rituales', url: 'operacion/rituales/index.html' }
  ]},
  { titulo: 'ORQUESTACIÓN', items: [
    { label: 'event bus', url: 'orquestacion/event-bus/index.html' },
    { label: 'router módulos', url: 'orquestacion/router-modulos/index.html' }
  ]},
  { titulo: 'PROYECTOS', items: [
    { label: 'acta', url: 'projects/acta/index.html' },
    { label: 'bóveda', url: 'projects/boveda/index.html' },
    { label: 'cymatic', url: 'projects/cymatic/index.html' },
    { label: 'cymatic live pro', url: 'projects/cymatic/live-pro.html' },
    { label: 'cymatic studio', url: 'projects/cymatic/studio.html' },
    { label: 'dmd-33', url: 'projects/dmd-33/index.html' },
    { label: 'dmd-33 orb', url: 'projects/dmd-33/orb.html' },
    { label: 'dmd-33 espejo', url: 'projects/dmd-33/espejo.html' },
    { label: 'dmd-33 genesis', url: 'projects/dmd-33/genesis.html' },
    { label: 'dmd-33 flow', url: 'projects/dmd-33/flow.html' },
    { label: 'dmd-33 kronos', url: 'projects/dmd-33/kronos.html' },
    { label: 'evidence OS', url: 'projects/evidence-os/index.html' },
    { label: 'evidence OS dashboard', url: 'projects/evidence-os/dashboard.html' },
    { label: 'genesis miner', url: 'projects/genesis-miner/index.html' },
    { label: 'kronos vault', url: 'projects/kronos-vault/index.html' },
    { label: 'md33', url: 'projects/md33/index.html' },
    { label: 'yejida', url: 'projects/yejida/index.html' }
  ]}
];

// ═══════════════════════════════════════════════════════════════════
// RENDERIZAR
// ═══════════════════════════════════════════════════════════════════

let totalPaginas = 0;
GRUPOS.forEach(g => totalPaginas += g.items.length);

document.getElementById('total').textContent = totalPaginas + ' páginas en ' + GRUPOS.length + ' secciones';

function construir() {
  const cont = document.getElementById('contenedor');
  cont.innerHTML = '';
  GRUPOS.forEach(g => {
    const grupo = document.createElement('div');
    grupo.className = 'grupo';

    const h2 = document.createElement('h2');
    h2.innerHTML = g.titulo + ' <span class="badge">' + g.items.length + '</span>';
    grupo.appendChild(h2);

    const cards = document.createElement('div');
    cards.className = 'cards';

    g.items.forEach(it => {
      const card = document.createElement('a');
      card.className = 'card';
      card.href = it.url;
      card.target = '_blank';
      card.rel = 'noopener noreferrer';
      card.dataset.busqueda = (it.label + ' ' + it.url + ' ' + g.titulo).toLowerCase();
      card.innerHTML =
        '<span class="label">' + it.label + '</span>' +
        '<span class="url">' + it.url + '</span>';
      cards.appendChild(card);
    });

    grupo.appendChild(cards);
    cont.appendChild(grupo);
  });
}

// ═══════════════════════════════════════════════════════════════════
// BUSCADOR
// ═══════════════════════════════════════════════════════════════════

function filtrar(texto) {
  const t = texto.trim().toLowerCase();
  const cards = document.querySelectorAll('.card');
  const grupos = document.querySelectorAll('.grupo');
  let visibles = 0;

  cards.forEach(c => {
    const match = !t || c.dataset.busqueda.includes(t);
    c.classList.toggle('oculto', !match);
    if (match) visibles++;
  });

  // Ocultar grupos sin tarjetas visibles
  grupos.forEach(g => {
    const visiblesEnGrupo = g.querySelectorAll('.card:not(.oculto)').length;
    g.style.display = visiblesEnGrupo > 0 ? '' : 'none';
  });

  const sinRes = document.getElementById('sin-resultados');
  sinRes.classList.toggle('visible', visibles === 0);
}

// ═══════════════════════════════════════════════════════════════════
// ARRANQUE
// ═══════════════════════════════════════════════════════════════════

document.getElementById('buscador').addEventListener('input', function(e) {
  filtrar(e.target.value);
});

construir();
</script>

</body>
</html>
