worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  tcp_nopush      on;
  keepalive_timeout 65;
  server_tokens   off;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

  # ─── Headers de seguridad ────────────────────────────────────
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Arkhe-Seal "◯_● · 51/49/100" always;

  server {
    listen       8080;
    server_name  arkhe.zero;

    root  /app;
    index index.html;

    # ─── Hub raíz ──────────────────────────────────────────────
    location / {
      try_files $uri $uri/ $uri.html =404;
    }

    # ─── 404 ceremonial ────────────────────────────────────────
    error_page 404 /apps/404.html;

    # ─── .well-known ───────────────────────────────────────────
    location /.well-known/ {
      try_files $uri =404;
      add_header Access-Control-Allow-Origin "*";
    }

    # ─── robots + sitemap ──────────────────────────────────────
    location = /robots.txt  { access_log off; log_not_found off; }
    location = /sitemap.xml { access_log off; log_not_found off; }

    # ─── Seguridad: bloquear accesos ───────────────────────────
    location ~ /\.(env|git|key|pem) { deny all; }
    location ~ /07-LLAVES/         { deny all; }
    location ~ /secrets/            { deny all; }

    # ─── Cache estático ────────────────────────────────────────
    location ~* \.(css|js|svg|woff2?|png|jpg|ico)$ {
      expires 30d;
      add_header Cache-Control "public, immutable";
    }
  }
}

