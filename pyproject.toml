[project]
name = "arkhe-zero"
version = "1.0.0"
description = "ARKHÉ ZERO · Índice Primigenio Soberano · Local-First · Humano-IA"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Marco Antonio Rojas Valdovinos", email = "marco@arkhe.zero" }
]
keywords = ["arkhe", "kronos", "kintsugi", "post-quantum", "51-49-100", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security :: Cryptography",
  "Topic :: System :: Archiving",
]

dependencies = [
  "cryptography>=42.0.0",
  "pynacl>=1.5.0",
  "web3>=6.15.0",
  "rfc3161ng>=2.1.3",
  "httpx>=0.26.0",
  "pyyaml>=6.0.1",
  "python-dotenv>=1.0.0",
  "click>=8.1.7",
  "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=4.1.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.2.0",
  "mypy>=1.8.0",
]

[project.scripts]
arkhe = "src.cli:main"

[project.urls]
Homepage = "https://arkhe.zero"
Repository = "https://github.com/marcojas17/kronos-protocol"
Changelog = "https://arkhe.zero/CHANGELOG.md"
"Safe Creative (Arq.)" = "2607146379465"
"Safe Creative (Co.)" = "2607086319439"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "test-*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing"

# ◯_● · 51/49/100 · KRONOS