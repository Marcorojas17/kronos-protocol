<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ARKHÉ ZERO</title>
    <style>
      body {
        margin: 0;
        background: #000;
        color: #d4af37;
        font-family: monospace;
        overflow: hidden;
      }
      canvas {
        position: fixed;
        top: 0;
        left: 0;
      }
      #c {
        position: relative;
        z-index: 2;
        text-align: center;
        margin-top: 25vh;
        font-size: 28px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <canvas id="bg"></canvas>
    <div id="c">
      ◯_● ARKHÉ ZERO<br />YHDRYH-92CE · SCDR-001<br />51/49/100<br /><br /><span
        style="font-size: 14px"
        >El legado no se hereda. Se firma. — KINTSUGI 2026</span
      >
    </div>
    <script>
      const C = document.getElementById('bg'),
        X = C.getContext('2d');
      C.width = innerWidth;
      C.height = innerHeight;
      let P = [];
      for (let i = 0; i < 150; i++)
        P.push({
          x: Math.random() * C.width,
          y: Math.random() * C.height,
          vx: (Math.random() - 0.5) * 0.5,
          vy: (Math.random() - 0.5) * 0.5,
        });
      (function L() {
        X.clearRect(0, 0, C.width, C.height);
        X.fillStyle = '#D4AF37';
        P.forEach((o) => {
          o.x += o.vx;
          o.y += o.vy;
          if (o.x < 0 || o.x > C.width) o.vx *= -1;
          if (o.y < 0 || o.y > C.height) o.vy *= -1;
          X.fillRect(o.x, o.y, 1.5, 1.5);
        });
        requestAnimationFrame(L);
      })();
    </script>
  </body>
</html>
