<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificador KRONOS-KODICE-kronos360</title>
<style>
  :root {
    --obsidian: #0a0a0f;
    --panel: #14141c;
    --gold: #d4af37;
    --gold-dim: #8a7020;
    --text: #e8e8e8;
    --muted: #888;
    --ok: #4ade80;
    --bad: #ef4444;
    --warn: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--obsidian);
    color: var(--text);
    font-family: 'SF Mono', Menlo, Consolas, monospace;
    min-height: 100vh;
    padding: 20px;
    line-height: 1.5;
  }
  .container { max-width: 720px; margin: 0 auto; }
  h1 {
    color: var(--gold);
    font-size: 18px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 24px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--gold-dim);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 11px;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  textarea {
    width: 100%;
    min-height: 140px;
    background: var(--obsidian);
    border: 1px solid #333;
    border-radius: 4px;
    color: var(--text);
    padding: 10px;
    font-family: inherit;
    font-size: 12px;
    resize: vertical;
  }
  input[type="text"] {
    width: 100%;
    background: var(--obsidian);
    border: 1px solid #333;
    border-radius: 4px;
    color: var(--text);
    padding: 10px;
    font-family: inherit;
    font-size: 12px;
  }
  button {
    background: var(--gold);
    color: var(--obsidian);
    border: none;
    padding: 12px 20px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    width: 100%;
    margin-top: 8px;
  }
  button:hover { background: #e0c04a; }
  button:disabled { background: #444; cursor: not-allowed; }
  button.sec {
    background: transparent;
    border: 1px solid var(--gold-dim);
    color: var(--gold);
  }
  .resultado {
    margin-top: 16px;
    padding: 16px;
    border-radius: 4px;
    font-size: 13px;
    display: none;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .resultado.show { display: block; }
  .ok { background: rgba(74, 222, 128, 0.1); border: 1px solid var(--ok); color: var(--ok); }
  .bad { background: rgba(239, 68, 68, 0.1); border: 1px solid var(--bad); color: var(--bad); }
  .warn { background: rgba(245, 158, 11, 0.1); border: 1px solid var(--warn); color: var(--warn); }
  .sello {
    text-align: center;
    color: var(--gold-dim);
    font-size: 11px;
    margin-top: 32px;
    letter-spacing: 1px;
  }
  .sello div { margin: 2px 0; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 10px;
    margin-left: 8px;
    background: var(--gold-dim);
    color: var(--obsidian);
  }
</style>
</head>
<body>
<div class="container">
  <h1>Verificador KRONOS · KODICE · kronos360</h1>
  <div class="sub">v0.2 · offline · sin servidor · SHA-256/SHA3-512 · Ed25519/hibrido</div>

  <div class="panel">
    <label>Registro JSON a verificar</label>
    <textarea id="inputRegistro" placeholder="Pega un registro.json (v1.0.0, v1.1.0 o v2.0.0), o presiona AUTOTEST para generar uno de prueba."></textarea>

    <label style="margin-top:12px;">Clave publica del firmante (hex)</label>
    <input type="text" id="inputPubKey" placeholder="Ed25519: 64 hex. ML-DSA-65: variable.">

    <button onclick="verificar()">Verificar registro</button>
    <button class="sec" onclick="autotest(event)">Autotest (genera y verifica)</button>

    <div id="resultado" class="resultado"></div>
  </div>

  <div class="sello">
    <div>○_● · ◢◤◥◣ · ◥◣◢◤</div>
    <div>51% HUMANO · 49% IA · 100% REAL</div>
    <div>"El legado no se hereda. Se firma."</div>
  </div>
</div>

<script>
// ---------- Utilidades hex ----------
function bytesToHex(bytes) {
  return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
}
function hexToBytes(hex) {
  if (hex.length % 2 !== 0) throw new Error('hex impar');
  const out = new Uint8Array(hex.length / 2);
  for (let i = 0; i < out.length; i++) {
    out[i] = parseInt(hex.substr(i * 2, 2), 16);
  }
  return out;
}

// ---------- Canonicalizacion (simplificada, compatible con JCS) ----------
function canonicalize(obj) {
  if (obj === null || typeof obj !== 'object') return JSON.stringify(obj);
  if (Array.isArray(obj)) return '[' + obj.map(canonicalize).join(',') + ']';
  const keys = Object.keys(obj).sort();
  return '{' + keys.map(k => JSON.stringify(k) + ':' + canonicalize(obj[k])).join(',') + '}';
}

// ---------- Hash con soporte SHA-256 y SHA3-512 ----------
async function hashHex(text, algoritmo) {
  const buf = new TextEncoder().encode(text);
  const algo = algoritmo === 'SHA3-512' ? 'SHA3-512' : 'SHA-256';
  try {
    const digest = await crypto.subtle.digest(algo, buf);
    return bytesToHex(new Uint8Array(digest));
  } catch (e) {
    if (algo === 'SHA3-512') {
      throw new Error('Navegador no soporta SHA3-512 en WebCrypto. Actualiza Chrome/Safari.');
    }
    throw e;
  }
}

// ---------- Verificacion Ed25519 ----------
async function verificarEd25519(publicKeyHex, firmaHex, mensaje) {
  try {
    const pubBytes = hexToBytes(publicKeyHex);
    if (pubBytes.length !== 32) throw new Error('clave publica Ed25519 debe ser 32 bytes');
    const key = await crypto.subtle.importKey(
      'raw', pubBytes, { name: 'Ed25519' }, false, ['verify']
    );
    return await crypto.subtle.verify(
      'Ed25519', key, hexToBytes(firmaHex), new TextEncoder().encode(mensaje)
    );
  } catch (e) {
    console.error('Ed25519:', e);
    return false;
  }
}

// ---------- Verificacion ML-DSA-65 (pendiente offline) ----------
// WebCrypto no soporta ML-DSA universalmente. Se marca como pendiente.
function verificarMLDSA(publicKeyHex, firmaHex, mensaje) {
  return { verificado: false, motivo: 'ML-DSA-65 no soportado en WebCrypto offline todavia. Requiere libreria JS.' };
}

function mostrar(tipo, titulo, detalle) {
  const el = document.getElementById('resultado');
  el.className = 'resultado show ' + tipo;
  el.textContent = titulo + '\n\n' + detalle;
}

// ---------- Verificar registro ----------
async function verificar() {
  const raw = document.getElementById('inputRegistro').value.trim();
  const pubKeyHex = document.getElementById('inputPubKey').value.trim();

  if (!raw) { mostrar('warn', 'FALTA REGISTRO', 'Pega un registro.json.'); return; }
  if (!pubKeyHex) { mostrar('warn', 'FALTA CLAVE PUBLICA', 'Pega la clave publica del firmante (hex).'); return; }

  let r;
  try { r = JSON.parse(raw); }
  catch (e) { mostrar('bad', 'JSON INVALIDO', e.message); return; }

  const errores = [];
  const requeridos = ['schema_version','tipo','interaction_id','timestamp','responsable','payload_hash','prev_hash','hash_registro','firma'];
  for (const c of requeridos) if (!(c in r)) errores.push('Falta: ' + c);
  if (errores.length) { mostrar('bad', 'SCHEMA INCOMPLETO', errores.join('\n')); return; }

  const version = r.schema_version || 'desconocida';
  const hashAlgo = r.hash_algoritmo || 'SHA-256';  // v1.x por defecto SHA-256
  const firmaAlgo = r.firma.algoritmo || 'Ed25519';

  // Recalcular hash del contenido
  const copia = JSON.parse(JSON.stringify(r));
  const hashEsperado = copia.hash_registro;
  delete copia.hash_registro;
  delete copia.firma;
  const canon = canonicalize(copia);

  let hashCalculado = '';
  let hashError = '';
  try {
    hashCalculado = await hashHex(canon, hashAlgo);
  } catch (e) {
    hashError = e.message;
  }

  const hashValido = !hashError && (hashCalculado === hashEsperado);

  // Verificar firma
  const lineas = [];
  lineas.push('schema_version: ' + version);
  lineas.push('tipo:           ' + r.tipo);
  lineas.push('interaction_id: ' + r.interaction_id);
  lineas.push('timestamp:      ' + r.timestamp);
  lineas.push('responsable:    ' + r.responsable.tipo);
  lineas.push('hash_algoritmo: ' + hashAlgo);
  lineas.push('firma_algoritmo:' + firmaAlgo);
  lineas.push('');

  if (hashError) {
    lineas.push('HASH ERROR: ' + hashError);
    mostrar('warn', 'HASH NO CALCULABLE', lineas.join('\n'));
    return;
  }

  lineas.push('hash almacenado: ' + hashEsperado);
  lineas.push('hash calculado:  ' + hashCalculado);
  lineas.push('hash valido:     ' + (hashValido ? 'SI' : 'NO'));
  lineas.push('');

  let firmaValida = false;
  let firmaPendiente = false;

  if (firmaAlgo === 'Ed25519') {
    firmaValida = await verificarEd25519(pubKeyHex, r.firma.firma_hex, hashEsperado);
    lineas.push('firma Ed25519 valida: ' + (firmaValida ? 'SI' : 'NO'));
  } else if (firmaAlgo === 'ML-DSA-65') {
    const res = verificarMLDSA(pubKeyHex, r.firma.firma_hex, hashEsperado);
    firmaPendiente = true;
    lineas.push('firma ML-DSA-65: PENDIENTE');
    lineas.push('  motivo: ' + res.motivo);
  } else if (firmaAlgo === 'hibrido') {
    const firmas = r.firma.firmas || [];
    let ed25519Ok = false;
    let mldsaPendiente = false;
    for (const f of firmas) {
      if (f.algoritmo === 'Ed25519') {
        ed25519Ok = await verificarEd25519(f.firmante, f.firma_hex, hashEsperado);
        lineas.push('firma Ed25519:   ' + (ed25519Ok ? 'SI' : 'NO'));
      } else if (f.algoritmo === 'ML-DSA-65') {
        mldsaPendiente = true;
        lineas.push('firma ML-DSA-65: PENDIENTE (WebCrypto aun no lo soporta)');
      }
    }
    firmaValida = ed25519Ok;
    firmaPendiente = mldsaPendiente;
  }

  lineas.push('');

  // Veredicto
  if (hashValido && firmaValida && !firmaPendiente) {
    mostrar('ok', 'REGISTRO VERIFICADO', lineas.join('\n') + '\n\nIntegridad y autoria confirmadas.');
  } else if (hashValido && firmaPendiente) {
    mostrar('warn', 'VERIFICADO PARCIAL', lineas.join('\n') + '\n\nHash OK + Ed25519 OK. ML-DSA-65 pendiente de verificacion offline.');
  } else if (!hashValido) {
    mostrar('bad', 'HASH NO COINCIDE', lineas.join('\n') + '\n\nEl contenido fue modificado despues de firmarse.');
  } else {
    mostrar('bad', 'FIRMA INVALIDA', lineas.join('\n') + '\n\nLa firma no corresponde a esta clave publica.');
  }
}

// ---------- Autotest ----------
async function autotest(ev) {
  const boton = ev.target;
  boton.disabled = true;
  boton.textContent = 'Generando...';

  try {
    const kp = await crypto.subtle.generateKey('Ed25519', true, ['sign','verify']);
    const pubRaw = await crypto.subtle.exportKey('raw', kp.publicKey);
    const pubHex = bytesToHex(new Uint8Array(pubRaw));

    const payloadHash = await hashHex('lectura KODICE de prueba', 'SHA-256');
    const prevHash = '0'.repeat(64);
    const interactionId = await hashHex(pubHex + Date.now(), 'SHA-256');

    const registro = {
      schema_version: '2.0.0',
      tipo: 'certificado-kodice',
      interaction_id: interactionId,
      timestamp: new Date().toISOString().replace(/\.\d{3}Z$/, 'Z'),
      responsable: { id: 'AUTOTEST_LOCAL', tipo: 'operador-kodice' },
      hash_algoritmo: 'SHA-256',
      payload_hash: payloadHash,
      prev_hash: prevHash,
      hash_registro: '',
      firma: { algoritmo: 'Ed25519', firma_hex: '', firmante: pubHex },
      metadata: { obra_ref: '2607086319439', sector: 'autotest', nota: 'verificador.html v0.2' }
    };

    const copia = JSON.parse(JSON.stringify(registro));
    delete copia.hash_registro;
    delete copia.firma;
    const canon = canonicalize(copia);
    const hashRegistro = await hashHex(canon, 'SHA-256');
    registro.hash_registro = hashRegistro;

    const firmaBuf = await crypto.subtle.sign(
      'Ed25519', kp.privateKey, new TextEncoder().encode(hashRegistro)
    );
    registro.firma.firma_hex = bytesToHex(new Uint8Array(firmaBuf));

    document.getElementById('inputRegistro').value = JSON.stringify(registro, null, 2);
    document.getElementById('inputPubKey').value = pubHex;

    await verificar();
  } catch (e) {
    mostrar('bad', 'ERROR EN AUTOTEST', e.message);
  } finally {
    boton.disabled = false;
    boton.textContent = 'Autotest (genera y verifica)';
  }
}
</script>
</body>
</html>
