<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carrusel ARKHÉ</title>
<style>body{margin:0;background:#0a0a0a;color:#fff;font-family:system-ui}
.carru{position:relative;overflow:hidden;max-width:1100px;margin:20px auto;aspect-ratio:16/9;background:#000;border-radius:16px}
.carru-track{display:flex;transition:transform .5s ease;height:100%}
.carru-slide{min-width:100%;height:100%;object-fit:cover;background:#111}
.carru-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);color:#fff;border:0;padding:12px 18px;cursor:pointer;font-size:22px;border-radius:999px}
.carru-btn.prev{left:12px}.carru-btn.next{right:12px}
.carru-dots{position:absolute;bottom:14px;left:0;right:0;display:flex;gap:8px;justify-content:center}
.carru-dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.4);border:0;cursor:pointer}.carru-dot.active{background:#fff}</style>
<div class="carru" id="carru"><div class="carru-track" id="track"></div><button class="carru-btn prev">‹</button><button class="carru-btn next">›</button><div class="carru-dots" id="dots"></div></div>
<script>
(()=>{const c=document.getElementById('carru'),track=document.getElementById('track'),dotsBox=document.getElementById('dots');
const imgs=["./img/img1.jpg","./img/img2.jpg","./img/img3.jpg"];
imgs.forEach(s=>{const im=document.createElement('img');im.className='carru-slide';im.src=s;track.appendChild(im)});
const slides=[...track.children];let i=0;slides.forEach((_,k)=>{const d=document.createElement('button');d.className='carru-dot'+(k==0?' active':'');d.onclick=()=>go(k);dotsBox.appendChild(d)});
const dots=[...dotsBox.children];
function go(n){i=(n+slides.length)%slides.length;track.style.transform='translateX(-'+(i*100)+'%)';dots.forEach((d,k)=>d.classList.toggle('active',k==i))}
c.querySelector('.prev').onclick=()=>go(i-1);c.querySelector('.next').onclick=()=>go(i+1);setInterval(()=>go(i+1),4000);})();
</script>
