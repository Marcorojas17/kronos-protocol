<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>◯_● Carrusel ARKHÉ ZERO</title>
<style>
  body { margin:0; background:#0a0a0a; color:#fff; font-family:'Courier New',monospace; padding:20px; }
  h1 { text-align:center; color:#D4AF37; letter-spacing:3px; font-size:18px; margin-bottom:20px; }
  .carru { position:relative; overflow:hidden; max-width:900px; margin:0 auto; aspect-ratio:16/9; background:#000; border-radius:16px; border:1px solid #D4AF37; box-shadow:0 0 30px rgba(212,175,55,0.3); }
  .carru-track { display:flex; transition:transform .5s ease; height:100%; }
  .carru-slide { min-width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#D4AF37; text-align:center; padding:20px; }
  .carru-slide.s1 { background: radial-gradient(circle at 30% 30%, #1a1400 0%, #000 100%); }
  .carru-slide.s2 { background: radial-gradient(circle at 70% 50%, #001a10 0%, #000 100%); }
  .carru-slide.s3 { background: radial-gradient(circle at 50% 70%, #1a001a 0%, #000 100%); }
  .carru-slide h2 { font-family:Georgia,serif; font-size:32px; letter-spacing:4px; margin-bottom:10px; text-shadow:0 0 20px #D4AF37; }
  .carru-slide p { font-size:12px; color:#c8ffc8; letter-spacing:2px; }
  .carru-slide .big { font-size:60px; margin-bottom:10px; }
  .carru-btn { position:absolute; top:50%; transform:translateY(-50%); background:rgba(0,0,0,0.7); color:#D4AF37; border:1px solid #D4AF37; padding:12px 18px; cursor:pointer; font-size:22px; border-radius:50%; width:50px; height:50px; display:flex; align-items:center; justify-content:center; }
  .carru-btn.prev { left:12px; }
  .carru-btn.next { right:12px; }
  .carru-dots { position:absolute; bottom:14px; left:0; right:0; display:flex; gap:10px; justify-content:center; }
  .carru-dot { width:12px; height:12px; border-radius:50%; background:rgba(212,175,55,0.3); border:1px solid #D4AF37; cursor:pointer; }
  .carru-dot.active { background:#D4AF37; box-shadow:0 0 10px #D4AF37; }
</style>
</head>
<body>
<h1>◯_● FILOSOFÍA ARKHÉ ZERO</h1>

<div class="carru" id="carru">
  <div class="carru-track" id="track">
    <div class="carru-slide s1">
      <div class="big">◯_●</div>
      <h2>EL LEGADO</h2>
      <p>NO SE HEREDA · SE FIRMA</p>
    </div>
    <div class="carru-slide s2">
      <div class="big">⛓️</div>
      <h2>BITCOIN</h2>
      <p>VERIFICACIÓN SOBERANA · NODO PROPIO</p>
    </div>
    <div class="carru-slide s3">
      <div class="big">⚛️</div>
      <h2>POST-CUÁNTICO</h2>
      <p>ED25519 + ML-DSA-65 · NIST FIPS 204</p>
    </div>
  </div>
  <button class="carru-btn prev" onclick="go(-1)">‹</button>
  <button class="carru-btn next" onclick="go(1)">›</button>
  <div class="carru-dots" id="dots"></div>
</div>

<script>
  const track = document.getElementById('track');
  const dotsBox = document.getElementById('dots');
  const slides = track.children;
  let i = 0;

  for (let k = 0; k < slides.length; k++) {
    const d = document.createElement('button');
    d.className = 'carru-dot' + (k === 0 ? ' active' : '');
    d.onclick = () => goTo(k);
    dotsBox.appendChild(d);
  }
  const dots = dotsBox.children;

  function goTo(n) {
    i = (n + slides.length) % slides.length;
    track.style.transform = 'translateX(-' + (i * 100) + '%)';
    for (let k = 0; k < dots.length; k++) {
      dots[k].classList.toggle('active', k === i);
    }
  }
  function go(dir) { goTo(i + dir); }

  setInterval(() => go(1), 5000);
</script>
</body>
</html>
