name: "095 Cartógrafo"
on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:
jobs:
  mapa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar grafo de dependencias
        run: |
          find . -name '*.js' -not -path './node_modules/*' \
            -exec grep -l "import" {} \; > /tmp/graph.txt
          wc -l /tmp/graph.txt