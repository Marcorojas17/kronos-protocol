name: 095-cartografo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Correr cartografo
        run: python3 05-AGENTES/095-cartografo/cartografo.py

      - name: Commit mapa
        run: |
          git config user.name "kronos-bot"
          git config user.email "bot@kronos.local"
          git add MAPA.md 05-AGENTES/095-cartografo/ultimo.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: mapa del repo [skip ci]" && git push || true