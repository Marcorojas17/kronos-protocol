name: Secrets Detect
on: [push, pull_request]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Buscar patrones de secretos
        run: |
          ! grep -rE '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|AIza[A-Za-z0-9]{35})' \
            --include='*.js' --include='*.ts' --include='*.json' --include='*.yml' \
            --exclude-dir=node_modules --exclude-dir=.git . || exit 1
      - name: Verificar no .env
        run: |
          test ! -f .env || (echo "❌ .env no debe commitearse" && exit 1)