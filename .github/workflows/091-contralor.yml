name: 091-contralor

on:
  push:
    branches: [main]
    paths:
      - '06-GOBERNANZA/ACTAS/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Correr contralor
        run: python3 05-AGENTES/091-contralor/contralor.py

      - name: Commit reporte
        run: |
          git config user.name "kronos-bot"
          git config user.email "bot@kronos.local"
          git add 05-AGENTES/091-contralor/ultimo.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: reporte contralor [skip ci]" && git push || true