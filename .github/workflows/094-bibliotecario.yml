name: "094 Bibliotecario"
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
jobs:
  indexar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python scripts/audit-structure.py --output=index.json
      - uses: actions/upload-artifact@v4
        with:
          name: index
          path: index.json