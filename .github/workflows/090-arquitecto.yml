name: "090 Arquitecto"
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
jobs:
  analizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - name: Análisis estructural
        run: python scripts/audit-structure.py