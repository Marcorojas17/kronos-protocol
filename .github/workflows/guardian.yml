name: Guardian
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          python scripts/index-cero-verify.py
          python scripts/verify-seal.py
          python scripts/pqc-audit.py