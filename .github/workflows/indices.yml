name: Indices
on:
  push:
    paths: ['**/*.md', '**/*.html']
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python scripts/audit-structure.py
      - run: python scripts/generate-sitemap.py