name: CI - Core System Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f core_system/requirements.txt ]; then pip install -r core_system/requirements.txt; fi
        pip install mcp google-genai requests

    - name: Check Python syntax in Core System
      run: |
        python -m py_compile core_system/arkhe_server.py core_system/global_server.py || echo "Revisar errores de sintaxis"

    - name: Run Reproducible Test
      run: |
        cd core_system
        python test_reproducible.py
