name: CI - Python & HTML Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install mcp google-genai requests

    - name: Check Python syntax
      run: |
        python -m py_compile arkhe_server.py global_server.py app_certifier.py || echo "No hay errores en Python"

    - name: Check HTML
      run: |
        if [ -f index.html ]; then echo "index.html existe y está listo."; fi
