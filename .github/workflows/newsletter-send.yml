name: Newsletter Send
on:
  schedule:
    - cron: '0 15 1 * *'
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python scripts/newsletter-send.py --edition=$(date +%Y-%m)