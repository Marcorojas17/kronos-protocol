name: 092-auditor-externo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

concurrency:
  group: commits-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  correr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Correr auditor
        run: python3 05-AGENTES/092-auditor-externo/auditor.py

      - name: Commit reporte
        run: |
          git config user.name "kronos-bot"
          git config user.email "bot@kronos.local"
          git add 05-AGENTES/092-auditor-externo/ultimo.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "chore: reporte auditor externo [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Alerta si hay secretos
        run: |
          if grep -q '"tipo": "secretos"' 05-AGENTES/092-auditor-externo/ultimo.json 2>/dev/null; then
            echo "::error::SECRETOS EXPUESTOS DETECTADOS"
            exit 1
          fi