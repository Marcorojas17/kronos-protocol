name: KRONOS · Verificar hashes

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: SHA-256 · manifest · verify.html
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Banner
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  KRONOS PROTOCOL · CI · VERIFICACIÓN SHA-256                 ║"
          echo "║  acta 2607086319439 · TX 0xd94bf2…a466                       ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

      - name: Verificar que el script existe
        run: |
          if [ ! -f "projects/md33/src/verifica_estandar.py" ]; then
            echo "✗ RECHAZADO — falta projects/md33/src/verifica_estandar.py"
            exit 1
          fi
          echo "✓ script encontrado"

      - name: Verificar que el manifest existe
        run: |
          if [ ! -f "evidence/manifest.json" ]; then
            echo "✗ RECHAZADO — falta evidence/manifest.json"
            exit 1
          fi
          echo "✓ manifest encontrado"

      - name: Calcular SHA-256 de verify.html
        run: |
          if [ -f "verify.html" ]; then
            python projects/md33/src/verifica_estandar.py hash verify.html
          else
            echo "⚠ verify.html aún no existe en raíz — se omite (no bloquea)"
          fi

      - name: Verificar contra manifest
        run: |
          if [ -f "verify.html" ] && [ -f "evidence/manifest.json" ]; then
            python projects/md33/src/verifica_estandar.py manifest evidence/manifest.json --file verify.html
          else
            echo "⚠ verificación cruzada omitida (falta archivo o manifest)"
          fi

      - name: Sello final
        if: success()
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  ✓ APROBADO — integridad declarada y verificada              ║"
          echo "║  Acta 2607086319439 · GUARDIAN-SHA ✅                        ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

      - name: Sello de rechazo
        if: failure()
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  ⛔ RECHAZADO — hash no coincide o archivo faltante          ║"
          echo "║  GUARDIAN-SHA bloquea el merge.                              ║"
          echo "╚══════════════════════════════════════════════════════════════╝"