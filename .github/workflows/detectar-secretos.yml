name: detectar-secretos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buscar patrones peligrosos
        run: |
          EXIT=0
          echo "=== Archivos .env reales ==="
          if find . -type f -name ".env" -not -name ".env.example" | grep -q .; then
            echo "ALERTA: archivo .env encontrado"
            find . -type f -name ".env" -not -name ".env.example"
            EXIT=1
          fi

          echo "=== Claves privadas en texto ==="
          if grep -rEn --exclude-dir=.git --exclude-dir=node_modules \
            "(PRIVATE_KEY|SECRET_KEY|ACCESS_TOKEN)=[A-Za-z0-9+/=]{20,}" . ; then
            echo "ALERTA: clave con valor real en texto"
            EXIT=1
          fi

          echo "=== Archivos PEM ==="
          if find . -type f \( -name "*.pem" -o -name "*.key" \) -not -path "./.git/*" | grep -q .; then
            echo "ALERTA: archivo PEM/key encontrado"
            find . -type f \( -name "*.pem" -o -name "*.key" \) -not -path "./.git/*"
            EXIT=1
          fi

          if [ $EXIT -eq 1 ]; then
            echo ""
            echo "REVISA antes de mergear. Nunca commitees claves reales."
            exit 1
          fi
          echo "OK: sin secretos expuestos"