name: 093-relator

on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Correr relator
        run: python3 05-AGENTES/093-relator/relator.py

      - name: Commit reporte
        run: |
          git config user.name "kronos-bot"
          git config user.email "bot@kronos.local"
          git add 05-AGENTES/093-relator/ultimo.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: reporte relator [skip ci]" && git push || true