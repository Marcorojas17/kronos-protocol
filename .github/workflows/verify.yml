name: VERIFY-SHA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar integridad contra MANIFEST
        run: |
          if [ ! -f MANIFEST.sha256 ]; then
            echo "⚠️  MANIFEST.sha256 no existe todavía"
            exit 0
          fi
          echo "Verificando archivos registrados..."
          FAIL=0
          while read -r line; do
            [[ "$line" =~ ^#.*$ ]] && continue
            [[ -z "$line" ]] && continue
            expected=$(echo "$line" | cut -d' ' -f1)
            file=$(echo "$line" | cut -d' ' -f3-)
            if [ ! -f "$file" ]; then
              echo "⚠️  FALTA: $file"
              continue
            fi
            actual=$(sha256sum "$file" | cut -d' ' -f1)
            if [ "$expected" = "$actual" ]; then
              echo "✅ $file"
            else
              echo "❌ MODIFICADO: $file"
              FAIL=1
            fi
          done < MANIFEST.sha256
          if [ $FAIL -eq 1 ]; then
            echo ""
            echo "⚠️  Hay archivos modificados. El próximo push del guardián los actualizará."
          fi