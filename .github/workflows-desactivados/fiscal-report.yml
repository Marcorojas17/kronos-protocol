name: Fiscal Report
on:
  schedule:
    - cron: '0 0 1 1,4,7,10 *'
  workflow_dispatch:
jobs:
  carf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - name: Generar reporte fiscal
        run: python scripts/fiscal-report.py --carf --period=quarter
      - uses: actions/upload-artifact@v4
        with:
          name: carf-report
          path: reportes/