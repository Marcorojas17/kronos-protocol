name: Social Publish
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python scripts/social-broadcast.py --event=release