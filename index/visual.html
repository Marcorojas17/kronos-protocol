<!DOCTYPE html><html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
●<title>◯_ ARKHÉ ZERO Visual</title>
<style>
body{background:#050507;color:#c8ffc8;font-family:monospace;padding:10px;margin:0}
h1{color:#ffd700;font-size:18px;text-align:center;letter-spacing:.2em}
.c{background:#0a0a0f;border:1px solid rgba(0,255,65,.3);padding:10px;margin-bottom:10px;border-radius:6px}
.c h2{color:#00ff41;font-size:11px;letter-spacing:.15em;margin:0 0 6px 0}
canvas{display:block;margin:auto;background:#000;border:1px solid rgba(0,255,65,.2)}
button{background:transparent;border:1px solid #00ff41;color:#00ff41;padding:6px 10px;font-family:inherit;font-size:9px;border-radius:3px;margin:3px;text-transform:uppercase}
button:active{background:#00ff41;color:#000}
.g{border-color:#ffd700;color:#ffd700}
.t{text-align:center;color:#6a8f6a;font-size:9px;margin-top:6px;letter-spacing:.1em}
</style></head><body>
<h1>◯_● ARKHÉ ZERO</h1>
<div class="t">51% HUMANO · 49% IA · 100% REAL</div>
<div class="c"><h2>✦ YEJIDÁ MANDALA</h2>
<canvas id="m" width="280" height="280"></canvas>
<div style="text-align:center"><button class="g" onclick="gen()">✦ Generar</button></div></div>
<div class="c"><h2>〜 CYMATIC STUDIO</h2>
<canvas id="cy" width="280" height="200"></canvas>
<div style="text-align:center"><button onclick="tg()">▶ Iniciar</button><button class="g" onclick="cm()">◆ Patrón</button></div></div>
<div class="c"><h2>📡 RADAR</h2>
<canvas id="rd" width="280" height="280"></canvas>
<div class="t">● Seguro · ● Amenaza</div></div>
<div class="t">◯_● · SCDR-001 · "El legado no se hereda. Se firma."</div>
<script>
function gen(){
var c=document.getElementById('m'),ctx=c.getContext('2d'),W=c.width,H=c.height,cx=W/2,cy=H/2;
ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
var s=Math.random()*1000;
for(var L=1;L<=9;L++){
var r=(L/9)*110,p=6+L*2,op=.3+(L/9)*.7;
ctx.strokeStyle='hsla('+(40+L*8)+',100%,60%,'+op+')';
ctx.lineWidth=L===9?2:1;ctx.beginPath();
for(var i=0;i<=p;i++){
var a=(i/p)*Math.PI*2,rr=r+10*Math.sin(s+i*3.14);
var x=cx+rr*Math.cos(a),y=cy+rr*Math.sin(a);
i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
}
ctx.closePath();ctx.stroke();
}
ctx.beginPath();ctx.arc(cx,cy,8,0,Math.PI*2);ctx.fillStyle='#ffd700';ctx.fill();
}
gen();
var cR=false,cM=0,cT=0;
function dc(){
var c=document.getElementById('cy'),ctx=c.getContext('2d'),W=c.width,H=c.height,cx=W/2,cy=H/2;
ctx.fillStyle='rgba(0,0,0,.08)';ctx.fillRect(0,0,W,H);
cT+=.02;
if(cM===0){ctx.strokeStyle='rgba(0,255,65,.6)';ctx.beginPath();
for(var t=0;t<Math.PI*2;t+=.05){var r=60+25*Math.sin(3*t+cT)*Math.cos(3*t);var x=cx+r*Math.cos(t),y=cy+r*Math.sin(t);t===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
ctx.closePath();ctx.stroke();}
else if(cM===1){ctx.strokeStyle='rgba(255,215,0,.7)';ctx.beginPath();
for(var t=0;t<Math.PI*4;t+=.02){var x=cx+80*Math.sin(3*t+cT),y=cy+80*Math.sin(2*t);t===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
ctx.stroke();}
else{ctx.strokeStyle='rgba(0,255,65,.7)';ctx.beginPath();
for(var t=0;t<Math.PI*8;t+=.05){var r=3*t;if(r>90)break;var x=cx+r*Math.cos(t+cT),y=cy+r*Math.sin(t+cT);t===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
ctx.stroke();}
if(cR)requestAnimationFrame(dc);
}
function tg(){cR=!cR;if(cR)dc();}
function cm(){cM=(cM+1)%3;}
dc();
var rD=[];
function dr(){
var c=document.getElementById('rd'),ctx=c.getContext('2d'),W=c.width,H=c.height,cx=W/2,cy=H/2;
ctx.clearRect(0,0,W,H);
for(var r=30;r<=130;r+=33){ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.strokeStyle='rgba(0,255,65,.2)';ctx.stroke();}
var a=(Date.now()/10)%360,rad=a*Math.PI/180;
ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+135*Math.cos(rad),cy+135*Math.sin(rad));
ctx.strokeStyle='rgba(0,255,65,.9)';ctx.lineWidth=2;ctx.stroke();
if(Math.random()>.95){var an=Math.random()*Math.PI*2,rr=20+Math.random()*110;rD.push({x:cx+rr*Math.cos(an),y:cy+rr*Math.sin(an),t:Math.random()>.7});if(rD.length>25)rD.shift();}
rD.forEach(function(d){ctx.beginPath();ctx.arc(d.x,d.y,d.t?4:3,0,Math.PI*2);ctx.fillStyle=d.t?'#ff3355':'#00ff41';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=10;ctx.fill();ctx.shadowBlur=0;});
ctx.beginPath();ctx.arc(cx,cy,5,0,Math.PI*2);ctx.fillStyle='#ffd700';ctx.shadowColor='#ffd700';ctx.shadowBlur=15;ctx.fill();ctx.shadowBlur=0;
requestAnimationFrame(dr);
}
dr();
</script></body></html>
