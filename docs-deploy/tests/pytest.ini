[pytest]
testpaths = tests
python_files = test_*.py test-*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=crypto
    --cov=cimiento
    --cov=provenance
    --cov-report=term-missing
    --cov-report=html:coverage/html
    --cov-fail-under=70
markers =
    unit: tests unitarios
    integration: tests de integración
    e2e: tests end-to-end
    slow: tests lentos
    pqc: tests de criptografía post-cuántica

