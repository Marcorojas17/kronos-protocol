<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Ciclo de Vida</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #030308;
        color: #c8ffc8;
        font-family: 'Courier New', monospace;
        min-height: 100vh;
      }
      .wrap {
        max-width: 900px;
        margin: auto;
        padding: 60px 20px;
      }
      h1 {
        font-family: 'Cinzel', serif;
        font-size: 32px;
        letter-spacing: 0.25em;
        color: #ffd700;
        text-align: center;
        text-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
        margin-bottom: 12px;
      }
      .sub {
        text-align: center;
        color: #6a8f6a;
        font-size: 11px;
        letter-spacing: 0.25em;
        margin-bottom: 40px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .card {
        background: rgba(15, 15, 24, 0.6);
        border: 1px solid rgba(255, 215, 0, 0.2);
        padding: 20px;
        text-decoration: none;
        color: inherit;
        transition: all 0.3s;
      }
      .card:hover {
        border-color: #ffd700;
        transform: translateY(-3px);
        box-shadow: 0 10px 30px rgba(255, 215, 0, 0.15);
      }
      .card .n {
        color: #ffd700;
        font-size: 9px;
        letter-spacing: 0.3em;
        margin-bottom: 6px;
      }
      .card .t {
        color: #00ff41;
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 6px;
        font-family: 'Cinzel', serif;
      }
      .card .d {
        color: #8ea88e;
        font-size: 11px;
        line-height: 1.5;
      }
      .back {
        display: block;
        text-align: center;
        margin-top: 40px;
        color: #ffd700;
        text-decoration: none;
        font-size: 11px;
        letter-spacing: 0.2em;
        padding: 12px;
        border: 1px solid rgba(255, 215, 0, 0.2);
      }
      .back:hover {
        border-color: #ffd700;
        background: rgba(255, 215, 0, 0.05);
      }
      footer {
        text-align: center;
        margin-top: 40px;
        color: #6a8f6a;
        font-size: 10px;
        letter-spacing: 0.2em;
        padding-top: 20px;
        border-top: 1px solid rgba(255, 215, 0, 0.15);
      }
      footer .s {
        color: #ffd700;
        font-size: 13px;
        display: block;
        margin-bottom: 8px;
        font-family: 'Cinzel', serif;
        letter-spacing: 0.3em;
      }
      @media (max-width: 600px) {
        .grid {
          grid-template-columns: 1fr;
        }
        h1 {
          font-size: 22px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Ciclo de Vida</h1>
      <div class="sub">SECCIÓN 18 · EXPORT + FIN DIGNO</div>
      <div class="grid">
        <a class="card" href="export-cifrado/index.html"
          ><div class="n">EXPORT</div>
          <div class="t">📦 Export Cifrado</div>
          <div class="d">Paquete de legado cifrado · auditoría</div></a
        >
        <a class="card" href="fin-digno/index.html"
          ><div class="n">FIN</div>
          <div class="t">⚱ Fin Digno</div>
          <div class="d">Protocolo de cierre respetuoso</div></a
        >
      </div>
      <a class="back" href="../index.html">← Volver al HUB principal</a>
      <footer><span class="s">◯_● · 51/49/100</span>NODO YHDRYH-92CE · SCDR-001</footer>
    </div>
  </body>
</html>
